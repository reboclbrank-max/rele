name: Testes do rele
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: testes-rele
  cancel-in-progress: false
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Contratos locais sem rede e sem credenciais
        run: node --experimental-strip-types --test testes/relay.test.mjs
